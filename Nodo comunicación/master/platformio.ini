[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

upload_port  = COM8       ; <-- ajustar al COM real del maestro
monitor_port = COM8
monitor_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=8192
    ; ── Logging unificado (humano+máquina) por Serial1 (NO por el USB de datos) ──
    ; 1=logging habilitado, 0=compila a cero (sin coste de CPU)
    -DDBG_ENABLE=1
    -DDBG_HUMAN=1
    -DDBG_MACHINE=1
    -DDBG_STREAM=Serial1
    -DDBG_LOG_BAUD=115200
    -DDBG_LOG_RX=16
    -DDBG_LOG_TX=17
    ; Número de nodos esclavos esperados
    -DNUM_SLAVES=3
    ; Deshabilitado: no queremos pulsos por muestra en el osciloscopio
    -DSAMPLE_PULSE_PIN=-1
    -DSAMPLE_PULSE_IDLE=0
    -DSAMPLE_PULSE_US=20
    ; Marcador unico de START para osciloscopio
    -DDEBUG_HARDWARE=1
    -DDEBUG_HW_START_PIN=15
    -DDEBUG_HW_START_IDLE=0
    ; Ancho del pulso START (maestro y esclavos). Cambiar tambien en slave/platformio.ini.
    -DSCOPE_START_PULSE_US=500
    ; HOT_WAIT: PRESTART -> consulta de esclavos -> settle corto -> START.
    -DHOTWAIT_QUERY_DELAY_MS=40
    -DHOTWAIT_QUERY_TIMEOUT_MS=220
    -DHOTWAIT_QUERY_RETRIES=10
    -DHOTWAIT_SETTLE_MS=100
    ; Cantidad y pausa extra entre ciclos del modo "Starts multiples".
    ; Periodo entre pulsos ~= handshake HOT_WAIT + SCOPE_MULTI_START_GAP_MS.
    -DSCOPE_MULTI_START_COUNT=128
    -DSCOPE_MULTI_START_GAP_MS=2500
