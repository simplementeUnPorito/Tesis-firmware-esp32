[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

upload_port  = COM8       ; <-- ajustar al COM real del maestro
monitor_port = COM8
monitor_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=8192
    ; Mantener en 0 cuando MATLAB usa el mismo puerto serial binario
    -DMASTER_SERIAL_LOG=0
    ; IMU del martillo: 0=stub (sin hardware), 1=real (habilitar driver en hammer_imu.h)
    -DHAMMER_IMU_ENABLED=0
    ; Número de nodos esclavos esperados
    -DNUM_SLAVES=3
    ; Pulso corto para osciloscopio por cada muestra que el maestro manda a MATLAB
    -DSAMPLE_PULSE_PIN=27
    -DSAMPLE_PULSE_IDLE=0
    -DSAMPLE_PULSE_US=2
    ; debugHardware: pulso al emitir CMD_START hacia esclavos
    -DDEBUG_HARDWARE=1
    -DDEBUG_HW_START_PIN=26
    -DDEBUG_HW_START_IDLE=0
    -DDEBUG_HW_START_US=10
