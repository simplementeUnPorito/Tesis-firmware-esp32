[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

upload_port  = COM8       ; <-- ajustar al COM real del maestro
monitor_port = COM8
monitor_speed = 921600

build_unflags =
    -Os

; ── Interfaz web (servida por el maestro sobre su propio AP) ────────────────
; Forks mantenidos por la comunidad ESP32Async — compatibles con el core
; arduino-esp32 3.x (los originales me-no-dev/* no compilan contra IDF 5).
lib_deps =
    https://github.com/ESP32Async/AsyncTCP.git
    https://github.com/ESP32Async/ESPAsyncWebServer.git

; La tabla de particiones default.csv ya trae una partición de datos de
; ~1.4 MB con label "spiffs" (offset 0x290000, tamaño 0x160000 — verificado
; en .pio/build/esp32dev/partitions.bin, suma 4 MB de flash). No hace falta
; una tabla custom: solo cambiamos el formato de imagen que `pio run -t
; uploadfs` construye y sube a esa misma partición.
board_build.filesystem = littlefs

build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=8192
    ; ── Logging unificado (humano+máquina) por Serial1 (NO por el USB de datos) ──
    ; 0=compila a cero (sin coste de CPU). Volver a 1 para diagnostico.
    -DDBG_ENABLE=0
    -DDBG_HUMAN=0
    -DDBG_MACHINE=0
    -DDBG_STREAM=Serial1
    -DDBG_LOG_BAUD=115200
    -DDBG_LOG_RX=16
    -DDBG_LOG_TX=17
    ; Número de nodos esclavos esperados
    -DNUM_SLAVES=8
    ; Deshabilitado: no queremos pulsos por muestra en el osciloscopio
    -DSAMPLE_PULSE_PIN=-1
    -DSAMPLE_PULSE_IDLE=0
    -DSAMPLE_PULSE_US=20
    ; Marcador unico de START para osciloscopio
    -DDEBUG_HARDWARE=1
    -DDEBUG_HW_START_PIN=15
    -DDEBUG_HW_START_IDLE=0
    ; Ancho del pulso START (maestro y esclavos). Cambiar tambien en slave/platformio.ini.
    -DSCOPE_START_PULSE_US=500
    ; HOT_WAIT: PRESTART -> consulta de esclavos -> settle corto -> START.
    -DHOTWAIT_QUERY_DELAY_MS=40
    -DHOTWAIT_QUERY_TIMEOUT_MS=220
    -DHOTWAIT_QUERY_RETRIES=10
    -DHOTWAIT_SETTLE_MS=100
    ; Cantidad y pausa extra entre ciclos del modo "Starts multiples".
    ; Periodo entre pulsos ~= handshake HOT_WAIT + SCOPE_MULTI_START_GAP_MS.
    -DSCOPE_MULTI_START_COUNT=128
    -DSCOPE_MULTI_START_GAP_MS=2500
    ; ── Auth WebSocket (opcional) ──────────────────────────────────────────
    ; Definir para exigir password antes de aceptar comandos por WS.
    ; Dejar comentado (o vacío) para sin autenticación.
    ; '-DWS_AUTH_TOKEN="geo2026"'
