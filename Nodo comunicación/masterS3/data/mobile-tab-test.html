<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body, iframe { width: 100%; height: 100%; margin: 0; border: 0; }
  body { overflow: hidden; }
</style>
<iframe id="app" src="/index.html"></iframe>
<script>
  const tab = new URLSearchParams(location.search).get('tab') || 'capture';
  document.getElementById('app').addEventListener('load', (event) => {
    event.currentTarget.contentDocument.getElementById(`tab-btn-${tab}`)?.click();
  });
</script>
