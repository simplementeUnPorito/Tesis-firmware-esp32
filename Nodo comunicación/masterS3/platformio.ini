; ESP32-S3 N16R8: UART0 por puente CH343; puertos siempre por CLI.
[platformio]
; El enlazador del S3 no puede escribir el .map en una ruta con acentos
; ("Nodo comunicación"): se compila en una ruta ASCII.
build_dir = C:/piobuild/masterS3

[env:masterS3]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
board_build.flash_mode = dio
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = particiones_ota_16mb.csv
framework = arduino
monitor_speed = 921600
build_src_flags = -include board_pins_s3.h
build_unflags =
    -Os
lib_deps =
    https://github.com/ESP32Async/AsyncTCP.git#v3.5.0
    https://github.com/ESP32Async/ESPAsyncWebServer.git#v3.12.1
board_build.filesystem = littlefs
build_flags =
    ${masters3_flags.flags}
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DDBG_ENABLE=0
    -DDBG_HUMAN=0
    -DDBG_STREAM=Serial1

[masters3_flags]
flags =
    -O2
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=8192
    -DDBG_MACHINE=0
    -DDBG_LOG_BAUD=115200
    -DDBG_LOG_RX=16
    -DDBG_LOG_TX=17
    -DNUM_SLAVES=8
    -DSAMPLE_PULSE_PIN=-1
    -DSAMPLE_PULSE_IDLE=0
    -DSAMPLE_PULSE_US=20
    -DDEBUG_HARDWARE=1
    -DDEBUG_HW_START_PIN=15
    -DDEBUG_HW_START_IDLE=0
    -DSCOPE_START_PULSE_US=500
    -DHOTWAIT_QUERY_DELAY_MS=40
    -DHOTWAIT_QUERY_TIMEOUT_MS=220
    -DHOTWAIT_QUERY_RETRIES=10
    -DHOTWAIT_SETTLE_MS=100
    -DAP_KEEP_BEACON_DURING_CAPTURE=1
    -DSCOPE_MULTI_START_COUNT=128
    -DSCOPE_MULTI_START_GAP_MS=2500


; Banco: log humano por la UART0 (puente CH343, el mismo COM que MATLAB),
; mezclado con los paquetes binarios 0x56. No usar con MATLAB conectado.
[env:masterS3_log]
extends = env:masterS3
build_flags =
    ${masters3_flags.flags}
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DDBG_ENABLE=1
    -DDBG_HUMAN=1
    -DDBG_STREAM=Serial
