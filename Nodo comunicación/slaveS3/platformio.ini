; ESP32-S3 N16R8: UART0 por puente CH343; puertos siempre por CLI.
[platformio]
default_envs = slaveS3
[env:slaveS3]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
board_build.flash_mode = dio
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default.csv
framework = arduino
lib_deps =
    adafruit/Adafruit SSD1306 @ 2.5.17
build_src_filter = +<*> -<main_selftest.cpp>
monitor_speed = 115200
build_unflags =
    -Os
build_flags =
    -O2
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=8192
    -DSLAVE_LOGS_ENABLE=1
    -DDBG_HUMAN=1
    -DDBG_MACHINE=0
    -DPSOC_DIAG_VERBOSE=0
    -DPSOC_CAL_LOG_POINTS=0
    -DPSOC_CAL_LOG_CLAMPED_POINTS=0
    -DPSOC_CAL_LOG_PROGRESS=0
    -DSLAVE_LOG_HELLO_TX=0
    -DSLAVE_LOG_STATUS_PERIODIC=0
    -DSLAVE_LOG_VIEW_UART=0
    -DSLAVE_USB_CMD_ENABLE=1
    -DSLAVE_LAB_TOOLS_ENABLE=1
    -DPSOC_AUTO_CAL_ON_READY=0
    -DPSOC_AUTO_CAL_DELAY_MS=500
    -DPSOC_AUTO_CAL_RETRY_MS=3000
    -DDBG_LOG_BAUD=115200
    -DMASTER_MAC0=0xFF
    -DMASTER_MAC1=0xFF
    -DMASTER_MAC2=0xFF
    -DMASTER_MAC3=0xFF
    -DMASTER_MAC4=0xFF
    -DMASTER_MAC5=0xFF
    -DPSOC_I2C_ENABLE=1
    -DPSOC_I2C_ADDR=0x42
    -DPSOC_I2C_SDA=8
    -DPSOC_I2C_SCL=9
    -DPSOC_UART_BAUD=115200
    -DPSOC_UART_RX=18
    -DPSOC_RESET_REQUEST_PIN=16
    -DPSOC_UART_TX=17
    -DSYNC_TO_PSOC_PIN=7
    -DSAMPLE_PULSE_PIN=-1
    -DSAMPLE_PULSE_IDLE=0
    -DSAMPLE_PULSE_US=20
    -DDEBUG_HARDWARE=0
    -DDEBUG_HW_START_IDLE=0
    -DSCOPE_START_PULSE_US=500
    -DBLINK_LED_PIN=2
    -DBLINK_LED_ACTIVE_LOW=0
    -DBLINK_TIMES=20
    -DBLINK_INTERVAL_MS=250
    -DLOCAL_UI_ENABLE=1
    -DLOCAL_OLED_SCK_PIN=12
    -DLOCAL_OLED_MOSI_PIN=11
    -DLOCAL_OLED_CS_PIN=10
    -DLOCAL_OLED_DC_PIN=5
    -DLOCAL_OLED_RESET_PIN=6
    -DLOCAL_OLED_SPI_HZ=8000000UL
    -DLOCAL_BTN_UP_PIN=38
    -DLOCAL_BTN_DOWN_PIN=39
    -DLOCAL_BTN_OK_PIN=40
    -DLOCAL_BTN_BACK_PIN=41
    -DLOCAL_BUTTON_USE_INTERNAL_PULLUPS=1
    -DLOCAL_CAPTURE_BATCHES=10
    -DNODE_ID=1
    -DDEBUG_HW_START_PIN=15
    -DPSOC_RX_SCAN_ENABLE=0
