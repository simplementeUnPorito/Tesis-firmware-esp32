; ESP32-S3 N16R8: UART0 por puente CH343; puertos siempre por CLI.
[platformio]
; El enlazador del S3 no puede escribir el .map en una ruta con acentos
; ("Nodo comunicación"): se compila en una ruta ASCII.
build_dir = C:/piobuild/slaveS3
default_envs = slaveS3
[env:slaveS3]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
board_build.flash_mode = dio
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = particiones_ota_16mb.csv
framework = arduino
lib_deps =
    adafruit/Adafruit SSD1306 @ 2.5.17
build_src_filter = +<*> -<main_selftest.cpp>
monitor_speed = 115200
build_src_flags = -include board_pins_s3.h
build_unflags =
    -Os
build_flags =
    ${slaves3_flags.flags}
    -DNODE_ID=1

[slaves3_flags]
flags =
    -O2
    -DSIM_SIN_HW=1
    -DREMOTE_LOG_ENABLE=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=8192
    -DSLAVE_LOGS_ENABLE=1
    -DDBG_HUMAN=1
    -DDBG_MACHINE=0
    -DPSOC_DIAG_VERBOSE=0
    -DPSOC_CAL_LOG_POINTS=0
    -DPSOC_CAL_LOG_CLAMPED_POINTS=0
    -DPSOC_CAL_LOG_PROGRESS=0
    -DSLAVE_LOG_HELLO_TX=0
    -DSLAVE_LOG_STATUS_PERIODIC=0
    -DSLAVE_LOG_VIEW_UART=0
    -DSLAVE_USB_CMD_ENABLE=1
    -DSLAVE_LAB_TOOLS_ENABLE=1
    -DPSOC_AUTO_CAL_ON_READY=0
    -DPSOC_AUTO_CAL_DELAY_MS=500
    -DPSOC_AUTO_CAL_RETRY_MS=3000
    -DDBG_LOG_BAUD=115200
    -DMASTER_MAC0=0xFF
    -DMASTER_MAC1=0xFF
    -DMASTER_MAC2=0xFF
    -DMASTER_MAC3=0xFF
    -DMASTER_MAC4=0xFF
    -DMASTER_MAC5=0xFF
    -DSAMPLE_PULSE_PIN=-1
    -DSAMPLE_PULSE_IDLE=0
    -DSAMPLE_PULSE_US=20
    -DDEBUG_HARDWARE=0
    -DDEBUG_HW_START_IDLE=0
    -DSCOPE_START_PULSE_US=500
    -DBLINK_LED_PIN=2
    -DBLINK_LED_ACTIVE_LOW=0
    -DBLINK_TIMES=20
    -DBLINK_INTERVAL_MS=250
    -DDEBUG_HW_START_PIN=15
    -DPSOC_RX_SCAN_ENABLE=0


[env:slaveS3_2]
extends = env:slaveS3
build_flags =
    ${slaves3_flags.flags}
    -DNODE_ID=2

[env:slaveS3_3]
extends = env:slaveS3
build_flags =
    ${slaves3_flags.flags}
    -DNODE_ID=3

[env:slaveS3_4]
extends = env:slaveS3
build_flags =
    ${slaves3_flags.flags}
    -DNODE_ID=4
