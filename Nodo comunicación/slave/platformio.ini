[platformio]
default_envs = slave1, slave2

[env:base_esp32]
platform  = espressif32
board     = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=8192
    -DSAMPLE_PULSE_PIN=-1
    -DSAMPLE_PULSE_IDLE=0
    -DSAMPLE_PULSE_US=20
    ; Marcador unico de START para osciloscopio
    -DDEBUG_HARDWARE=1
    -DDEBUG_HW_START_IDLE=0
    ; Ancho del pulso START (debe coincidir con el master si queres comparar ancho)
    -DSCOPE_START_PULSE_US=1000

[env:slave1]
extends     = env:base_esp32
upload_port = COM11        ; <-- ajustar al COM real del esclavo 1
monitor_port= COM11
build_flags =
    ${env:base_esp32.build_flags}
    -DNODE_ID=1
    -DDEBUG_HW_START_PIN=32

[env:slave2]
extends     = env:base_esp32
upload_port = COM13       ; <-- ajustar al COM real del esclavo 2
monitor_port= COM13
build_flags =
    ${env:base_esp32.build_flags}
    -DNODE_ID=2
    -DDEBUG_HW_START_PIN=22
