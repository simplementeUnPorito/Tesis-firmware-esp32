[platformio]
; Compilar por defecto los tres firmwares de esclavo. Cada env usa el mismo
; codigo, pero cambia NODE_ID y el puerto COM para grabar/monitorear cada placa.
default_envs = slave1, slave2, slave3

[env:base_esp32]
; Configuracion comun para todos los esclavos ESP32. Los env slave1/2/3 heredan
; esto con "extends" y solo agregan lo que cambia por nodo fisico.
platform  = espressif32
board     = esp32dev
framework = arduino

lib_deps =
    adafruit/Adafruit SSD1306 @ 2.5.17

; main.cpp (campo) y main_selftest.cpp (autotest) definen cada uno su setup() y
; su loop(). Sin excluir uno de los dos el link falla por simbolo duplicado.
; Los envs de campo dejan afuera el autotest; slaveTest hace lo inverso.
build_src_filter = +<*> -<main_selftest.cpp>

; Velocidad del monitor serie USB del ESP. Esto NO es la UART al PSoC; es el
; puerto que se ve desde la PC para logs humanos/maquina del esclavo.
monitor_speed = 115200
build_unflags =
    -Os
build_flags =
    -O2
    ; Desactiva logs internos ruidosos del core Arduino/ESP-IDF.
    -DCORE_DEBUG_LEVEL=0

    ; Aumenta el stack del loop() de Arduino. Este firmware parsea UART,
    ; maneja ESP-NOW y buffers de captura; 8192 deja margen sin cambiar logica.
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=8192

    ; ── Logging unificado (humano+maquina) por el USB del esclavo ──
    ; Firmware final silencioso: sin logs USB ni comandos de laboratorio.
    ; Para banco de pruebas poner SLAVE_LOGS_ENABLE=1, DBG_HUMAN=1,
    ; SLAVE_USB_CMD_ENABLE=1 y SLAVE_LAB_TOOLS_ENABLE=1.
    -DSLAVE_LOGS_ENABLE=1

    ; Logs humanos/maquina apagados en firmware final.
    -DDBG_HUMAN=1

    -DDBG_MACHINE=0

    ; Logs finos. Por defecto dejamos el monitor limpio: eventos compactos de
    ; calibracion con raw32/abs/ok, sin HELLO/STATUS/RX_SCAN repetitivos.
    -DPSOC_DIAG_VERBOSE=0
    -DPSOC_CAL_LOG_POINTS=0
    -DPSOC_CAL_LOG_CLAMPED_POINTS=0
    -DPSOC_CAL_LOG_PROGRESS=0
    -DSLAVE_LOG_HELLO_TX=0
    -DSLAVE_LOG_STATUS_PERIODIC=0
    -DSLAVE_LOG_VIEW_UART=0
    -DSLAVE_USB_CMD_ENABLE=1
    -DSLAVE_LAB_TOOLS_ENABLE=1
    -DPSOC_AUTO_CAL_ON_READY=0
    -DPSOC_AUTO_CAL_DELAY_MS=500
    -DPSOC_AUTO_CAL_RETRY_MS=3000

    ; Baud real usado por dbgLogBegin() para el log USB del esclavo. Debe quedar
    ; igual a monitor_speed para que PlatformIO muestre texto legible.
    -DDBG_LOG_BAUD=115200

    ; ── ESP-NOW: MAC del ESP maestro ──
    ; Fallback de arranque para ACKs, estado y datos. El firmware aprende la MAC
    ; real del maestro desde el primer paquete recibido y pasa a unicast; si queres
    ; unicast desde el HELLO inicial, cambia estos seis bytes por la STA MAC que
    ; imprime el maestro. Formato: MASTER_MAC0:MASTER_MAC1:...:MASTER_MAC5.
    -DMASTER_MAC0=0xFF
    -DMASTER_MAC1=0xFF
    -DMASTER_MAC2=0xFF
    -DMASTER_MAC3=0xFF
    -DMASTER_MAC4=0xFF
    -DMASTER_MAC5=0xFF

    ; ── Enlace de subida PSoC → ESP por I2C (placa nueva, 2026-08-03) ──
    ; El PSoC es MAESTRO I2C y el ESP ESCLAVO en PSOC_I2C_ADDR. Por acá suben
    ; frames de muestras, pings, acks y diagnóstico: reemplaza al TX de la
    ; UART del PSoC, que a 115200 era el cuello de botella del stream.
    ; PSOC_I2C_ADDR debe coincidir con PSOC_LINK_I2C_ADDR del firmware PSoC.
    -DPSOC_I2C_ENABLE=1
    -DPSOC_I2C_ADDR=0x42
    -DPSOC_I2C_SDA=21
    -DPSOC_I2C_SCL=22

    ; ── UART hacia el PSoC (Serial2 en ESP32) ──
    ; PSOC_UART_BAUD debe coincidir con la UART configurada en el PSoC Creator.
    ; Por esta UART viajan comandos: set N, VDAC, PGA, preStart/debug, y vuelven
    ; los frames de muestras RAW. Ojo: el arranque real NO ocurre por UART.
    -DPSOC_UART_BAUD=115200

    ; PSOC_UART_RX ya NO recibe datos: el PSoC tiene la UART como solo-RX y
    ; contesta por I2C. Se deja definido porque los diagnósticos de pin
    ; (`pins`, contador de flancos) siguen mirando esa línea.
    ; PSOC_UART_RX es el pin RX del ESP32 para recibir lo que transmite el PSoC.
    ; PCB intermedia: ESP32 GPIO25 (J2.9) <- PSoC UART.TX / Tx = P12[7]
    ; (CY8CKIT-059 J1.9). Tx es OPEN_DRAIN_LO: necesita pull-up externo a 3V3
    ; en esta misma línea para que el ESP vea el nivel alto sin recibir 5 V.
    -DPSOC_UART_RX=25

    ; PSOC_UART_TX es el pin TX del ESP32 para mandar comandos al PSoC.
    ; PCB intermedia: ESP32 GPIO26 (J2.10) -> PSoC UART.RX / Rx = P2[0]
    ; (CY8CKIT-059 J1.1).
    -DPSOC_UART_TX=26

    ; ── Hardware sync entre ESP esclavo y PSoC ──
    ; No hay sync por cable desde el maestro: el arranque viaja por ESP-NOW y
    ; este esclavo lo convierte en el flanco de SYNC_TO_PSOC_PIN. Por eso se
    ; eliminó SYNC_IN_PIN (era GPIO32, nunca cableado en campo).
    ;
    ; SYNC_TO_PSOC_PIN es el pin IMPORTANTE para arrancar el PSoC:
    ;   ESP32 GPIO27 (J2.11) -> PSoC SYNC_IN = P1[5] (CY8CKIT-059 J1.22)
    ; El esclavo lo pone en HIGH en CMD_START/CMD_VIEW. Ese flanco de subida es
    ; lo que dispara la captura/conversion en el firmware del PSoC.
    -DSYNC_TO_PSOC_PIN=27

    ; ── Marcador opcional por cada lote/muestra para osciloscopio ──
    ; SAMPLE_PULSE_PIN genera pulsos de debug cuando llegan muestras/lotes.
    ; -1 significa deshabilitado: no ocupa ningun GPIO y no se ve en el scope.
    -DSAMPLE_PULSE_PIN=-1

    ; Nivel de reposo del pin SAMPLE_PULSE_PIN si estuviera habilitado.
    ; 0=LOW en reposo y pulso HIGH; 1=HIGH en reposo y pulso LOW.
    -DSAMPLE_PULSE_IDLE=0

    ; Duracion del pulso SAMPLE_PULSE_PIN en microsegundos. Como el pin esta en
    ; -1, este valor ahora no afecta al hardware.
    -DSAMPLE_PULSE_US=20

    ; ── Marcador unico de START para osciloscopio ──
    ; DEBUG_HARDWARE habilita un pulso separado para medir en el osciloscopio.
    ; Apagado por defecto: no conmutar GPIO/LED cerca ni durante muestreo.
    -DDEBUG_HARDWARE=0

    ; Nivel de reposo del marcador DEBUG_HW_START_PIN. 0=LOW en reposo y pulso
    ; HIGH; 1=HIGH en reposo y pulso LOW.
    -DDEBUG_HW_START_IDLE=0

    ; Ancho del pulso de marcador START en microsegundos. Sirve para comparar en
    ; el osciloscopio con otros pulsos de debug; no define el tiempo de muestreo.
    -DSCOPE_START_PULSE_US=500

    ; DEBUG_HW_START_PIN se define por esclavo mas abajo. Es solo un marcador
    ; visual para el osciloscopio; el pin que arranca al PSoC es SYNC_TO_PSOC_PIN.

    ; LED de identificacion (Titilar LED).
    ; En ESP32-DevKitC suele ser GPIO2 activo-ALTO. Si la web muestra ACK pero
    ; no se ve parpadeo fisico, cambiar BLINK_LED_PIN al LED real de esa placa.
    -DBLINK_LED_PIN=2
    ; Con 0: LED apagado en reposo, titila al comando.
    -DBLINK_LED_ACTIVE_LOW=0
    ; Patron largo para que sea visible a simple vista (~10 s).
    -DBLINK_TIMES=20
    -DBLINK_INTERVAL_MS=250

    ; ── Interfaz local: OLED SSD1306 SPI 128x64 + cuatro botones ──
    ; OLED por VSPI. No pisa GPIO21/22 (enlace I2C PSoC->ESP) ni GPIO26/27
    ; (UART de comandos y sync hacia el PSoC).
    -DLOCAL_UI_ENABLE=1
    -DLOCAL_OLED_SCK_PIN=18
    -DLOCAL_OLED_MOSI_PIN=23
    -DLOCAL_OLED_CS_PIN=33
    -DLOCAL_OLED_DC_PIN=16
    -DLOCAL_OLED_RESET_PIN=17
    -DLOCAL_OLED_SPI_HZ=8000000UL

    ; GPIO34/35/36/39 son solo entrada y NO tienen pull-up interno. Cada botón
    ; debe cerrar a GND y llevar un pull-up externo de 10 kOhm hacia 3V3.
    -DLOCAL_BTN_UP_PIN=34
    -DLOCAL_BTN_DOWN_PIN=35
    -DLOCAL_BTN_OK_PIN=36
    -DLOCAL_BTN_BACK_PIN=39
    -DLOCAL_BUTTON_USE_INTERNAL_PULLUPS=0
    -DLOCAL_CAPTURE_BATCHES=10

[env:slave1] ;HAMMER
extends     = env:base_esp32
upload_port = COM10        ; <-- ajustar al COM real del esclavo 1
monitor_port= COM10
build_flags =
    ${env:base_esp32.build_flags}
    ; Identidad logica de este firmware. El maestro usa NODE_ID para saber a que
    ; esclavo pedir datos/configuracion; tambien aparece en los logs como S1.
    -DNODE_ID=1

    ; GPIO de debug para osciloscopio: pulso cuando este esclavo detecta START.
    ; No va al PSoC y no inicia conversiones; solo permite medir tiempos.
    -DDEBUG_HW_START_PIN=15

    ; Diagnostico temporal de pines UART. Apagado por defecto: el scan mete mucho
    ; ruido en COM12. El mapeo PSoC vigente es Tx=P12[7] y Rx=P2[0].
    -DPSOC_RX_SCAN_ENABLE=0

[env:slave2] ;GEOPHONE PLACA ENTERA
extends     = env:base_esp32
upload_port = COM12     ; <-- ajustar al COM real del esclavo 2
monitor_port= COM12
build_flags =
    ${env:base_esp32.build_flags}
    ; Identidad logica de este firmware. Debe ser unica entre esclavos activos.
    -DNODE_ID=2

    ; Marcador de START para scope. Puede ser el mismo numero fisico que en otro
    ; esclavo porque cada ESP esta en su propia placa.
    -DDEBUG_HW_START_PIN=15

    ; ── SD (2026-07-11): PURGADA del ESP32 — la SD vive en el PSoC (SPI Master
    ; del TopDesign, comandos UART 0xBC/0xBD/0xBE). Sin -DSD_SPI_* sd_storage.cpp
    ; compila como stub sin efecto en TODOS los esclavos. Ver
    ; docs/plan_2929_decimation_sd.md ("SD: decisión actual").

[env:slave3] ;GEOPHONE PCB CHICA
extends     = env:base_esp32
upload_port = COM11       ; <-- ajustar al COM real del esclavo 3
monitor_port= COM11
build_flags =
    ${env:base_esp32.build_flags}
    ; Identidad logica de este fcirmware. El maestro distingue al nodo 3 con este
    ; valor en los mensajes ESP-NOW y en los paquetes de datos.
    -DNODE_ID=3

    ; Marcador de START para scope. No confundir con SYNC_TO_PSOC_PIN/GPIO27,
    ; que es el pin real hacia PSoC SYNC_IN.
    -DDEBUG_HW_START_PIN=15

    ; ── SD (2026-07-11): PURGADA del ESP32 — ver nota en slave2. ──

; ---------------------------------------------------------------------------
; [env:slaveTest] — FIRMWARE DE AUTOTEST DE PLACA
; ---------------------------------------------------------------------------
; No es un firmware de campo: sirve para validar que una placa recien armada
; este bien. Comparte todos los drivers con el esclavo real (psoc_uart,
; espnow_transport, local_ui) y solo cambia el main, asi que si se arregla un
; driver el autotest hereda el arreglo.
;
; Del otro lado va el proyecto PSoC
;   src/firmware/psoc/AcondicionamientoAnalogicoTest/AcondicionamientoAnalogico.cydsn
; que agrega los comandos 0xA0/0xA1/0xA2/0xA4/0xA7 y la trama de resultado
; 0xC5. Con el firmware de campo del PSoC el autotest corre igual, pero todos
; los tests de los grupos C y D dan FAIL por falta de respuesta.
;
;   pio run -e slaveTest -t upload
;   pio device monitor -p COM12 -b 115200
;
; Ojo: reflashear el ESP cuelga al PSoC. Despues de cada upload hay que hacer
; ToggleReset al PSoC por KitProg (ver BUILD_PROGRAM_PSOC.md).
[env:slaveTest]
extends     = env:base_esp32
upload_port = COM12
monitor_port= COM12
build_src_filter = +<*> -<main.cpp>
build_flags =
    ${env:base_esp32.build_flags}
    ; Habilita selftest_report.*; sin esto queda todo en stubs inline.
    -DSLAVE_SELFTEST=1

    ; Misma identidad que slave2 (GEO, placa entera): el autotest valida esa
    ; placa y conviene que se anuncie igual si el maestro esta escuchando.
    -DNODE_ID=2

    ; El autotest corre su propia calibracion como test D8, cuando le toca.
    ; Si arrancara sola al boot pisaria las mediciones de D1..D6, que
    ; necesitan la placa SIN calibrar.
    -DPSOC_AUTO_CAL_ON_READY=0
