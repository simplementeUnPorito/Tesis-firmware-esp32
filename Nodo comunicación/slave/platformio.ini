[platformio]
default_envs = esp8266_nodemcuv2

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

monitor_speed = 115200

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=8192
    -DNODE_ID=1
    ; Pulso corto para osciloscopio por cada muestra que el esclavo empaqueta/envía
    -DSAMPLE_PULSE_PIN=14
    -DSAMPLE_PULSE_IDLE=0
    -DSAMPLE_PULSE_US=2

[env:esp8266_nodemcuv2]
platform  = espressif8266
board     = nodemcuv2
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

build_flags =
    -DNODE_ID=1
    ; NodeMCU/D1 mini: GPIO2 = D4, idle alto para no dejar el LED onboard prendido
    -DSAMPLE_PULSE_PIN=2
    -DSAMPLE_PULSE_IDLE=1
    -DSAMPLE_PULSE_US=2

[env:esp8266_d1_mini]
platform  = espressif8266
board     = d1_mini
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

build_flags =
    -DNODE_ID=1
    ; D1 mini: GPIO2 = D4, idle alto para no dejar el LED onboard prendido
    -DSAMPLE_PULSE_PIN=2
    -DSAMPLE_PULSE_IDLE=1
    -DSAMPLE_PULSE_US=2
