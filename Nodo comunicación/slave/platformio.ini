[platformio]
default_envs = slave1, slave2, slave3

[env:base_esp32]
platform  = espressif32
board     = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=8192
    ; ── Logging unificado (humano+máquina) por el USB del esclavo ──
    ; 1=logging habilitado, 0=compila a cero (sin coste de CPU)
    -DDBG_ENABLE=1
    -DDBG_HUMAN=1
    -DDBG_MACHINE=1
    ; ── UART hacia el PSoC (Serial2 en ESP32) ──
    -DPSOC_UART_BAUD=460800
    -DPSOC_UART_RX=16
    -DPSOC_UART_TX=17
    -DSAMPLE_PULSE_PIN=-1
    -DSAMPLE_PULSE_IDLE=0
    -DSAMPLE_PULSE_US=20
    ; Marcador unico de START para osciloscopio
    -DDEBUG_HARDWARE=1
    -DDEBUG_HW_START_IDLE=0
    ; Ancho del pulso START (debe coincidir con el master si queres comparar ancho)
    -DSCOPE_START_PULSE_US=500

[env:slave1]
extends     = env:base_esp32
upload_port = COM11        ; <-- ajustar al COM real del esclavo 1
monitor_port= COM11
build_flags =
    ${env:base_esp32.build_flags}
    -DNODE_ID=1
    -DDEBUG_HW_START_PIN=15

[env:slave2]
extends     = env:base_esp32
upload_port = COM10       ; <-- ajustar al COM real del esclavo 2
monitor_port= COM10
build_flags =
    ${env:base_esp32.build_flags}
    -DNODE_ID=2
    -DDEBUG_HW_START_PIN=15

[env:slave3]
extends     = env:base_esp32
upload_port = COM13       ; <-- ajustar al COM real del esclavo 3
monitor_port= COM13
build_flags =
    ${env:base_esp32.build_flags}
    -DNODE_ID=3
    -DDEBUG_HW_START_PIN=15
